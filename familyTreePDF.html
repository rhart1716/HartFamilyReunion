<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Family Tree | Hart Family Archives</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,700&family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Outfit', sans-serif; color: #334155; background-color: #FDFBF7; }
        .serif-font { font-family: 'Playfair Display', serif; }
        .heritage-header { background: linear-gradient(135deg, #064E3B 0%, #022C22 100%); position: relative; overflow: hidden; }
        .header-bg-animate { position: absolute; inset: 0; background-image: url('https://www.transparenttextures.com/patterns/stardust.png'); opacity: 0.15; animation: grainShift 30s linear infinite; }
        @keyframes grainShift { 0% { background-position: 0 0; } 100% { background-position: 500px 500px; } }
        .feature-card { background: white; border: 1px solid #E2E8F0; }
        
        /* Updated Button Styles */
        .btn-orange { background-color: #C2410C; color: white; transition: background-color 0.2s; }
        .btn-orange:hover { background-color: #9A3412; }
    </style>
</head>
<body class="min-h-screen pb-20">

    <!-- Header -->
    <header class="heritage-header w-full pt-16 pb-20 px-4 text-center shadow-xl">
        <div class="header-bg-animate"></div>
        <div class="relative z-10 max-w-3xl mx-auto">
            <h1 class="text-4xl md:text-5xl serif-font font-bold mb-4 text-emerald-50 italic">Family Tree</h1>
            <p class="text-base md:text-lg text-emerald-100/80 font-light">Interactive view of the Hart Family structure.</p>
        </div>
    </header>

    <!-- Main Content -->
    <main class="container mx-auto max-w-5xl px-4 -mt-8 relative z-20">
        
        <section class="feature-card rounded-3xl p-6 md:p-8 shadow-sm">
            <!-- Download Action -->
            <div class="flex flex-col md:flex-row md:items-center justify-between mb-6 gap-4">
                <div>
                    <h2 class="serif-font text-2xl text-emerald-900">Document Viewer</h2>
                    <p class="text-sm text-slate-500">View the PDF in-browser or download it below.</p>
                </div>
                <a href="familyTree_v2.pdf" download class="px-6 py-3 rounded-xl text-xs font-bold btn-orange shadow-lg flex items-center justify-center gap-2">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                    Download PDF
                </a>
            </div>

            <!-- PDF Embed -->
            <div class="w-full h-[600px] md:h-[800px] rounded-2xl overflow-hidden border border-slate-200 bg-slate-100">
                <iframe src="familyTree_v2.pdf#view=FitH" class="w-full h-full" title="Family Tree PDF">
                    <p>Your browser does not support PDFs. <a href="familyTree_v2.pdf">Download the PDF instead.</a></p>
                </iframe>
            </div>
        </section>

        <!-- Elegant Heritage Divider Line -->
        <div class="relative my-16">
            <div class="absolute inset-0 flex items-center" aria-hidden="true">
                <div class="w-full border-t border-slate-300"></div>
            </div>
            <div class="relative flex justify-center">
                <span class="bg-[#FDFBF7] px-4 text-emerald-800/60">
                    <!-- Heritage Diamond Ornament -->
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 3v18M3 12h18M12 8l-4 4 4 4 4-4-4-4z"/>
                    </svg>
                </span>
            </div>
        </div>
        
    </main>

    <footer class="mt-12 text-center pb-10">
        <p class="serif-font text-slate-400 text-xl italic">&copy; <span id="yr"></span> Hart Family Archives</p>
        <p class="text-[9px] mt-4 text-slate-400/50 uppercase tracking-[0.6em] font-black">A Ryan Hart Production</p>
    </footer>

    <script>
        document.getElementById('yr').textContent = new Date().getFullYear();
    </script>

</body>
</html>
