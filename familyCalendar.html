        function getTypeColor(type) {
            if (type === "Birthday") return "bg-emerald-100 text-emerald-800";
            if (type === "Anniversary") return "bg-orange-100 text-orange-800";
            return "bg-slate-200 text-slate-800"; // Death color
        }

        function renderCalendar() {
            const container = document.getElementById('calendar-container');
            container.innerHTML = "";
            for (const [month, days] of Object.entries(calendarData)) {
                const section = document.createElement('div');
                section.className = "bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden";

                let dayHTML = "";
                // Sort days just in case data added out of order
                days.sort((a,b) => a.day - b.day).forEach(d => {
                    // Group by type
                    const grouped = d.events.reduce((acc, curr) => {
                        acc[curr.type] = acc[curr.type] || [];
                        acc[curr.type].push(curr.desc);
                        return acc;
                    }, {});

                    let eventList = "";
                    for(const [type, descs] of Object.entries(grouped)) {
                        eventList += `
                            <div class="flex flex-col gap-1 mb-2">
                                <span class="event-tag ${getTypeColor(type)} inline-block w-fit mb-1">${type}</span>
                                ${descs.map(desc => `<span class="text-slate-600 text-sm block">${desc}</span>`).join('')}
                            </div>
                        `;
                    }

                    dayHTML += `
                        <li class="border-b border-slate-50 pb-3 last:border-0">
                            <div class="flex gap-4 items-start">
                                <span class="font-bold text-emerald-700 w-8 text-lg">${d.day}</span>
                                <div class="flex flex-col gap-2 w-full">
                                    ${eventList}
                                </div>
                            </div>
                        </li>
                    `;
                });

                section.innerHTML = `
                    <button onclick="toggleMonth('${month}')" class="w-full flex items-center justify-between p-6 hover:bg-emerald-50 transition-colors">
                        <span class="serif-font text-2xl text-emerald-900">${month}</span>
                        <svg class="w-6 h-6 text-emerald-600 transition-transform" id="icon-${month}" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                    </button>
                    <div id="content-${month}" class="content-transition hidden-content px-6 pb-6">
                        <ul class="space-y-4">${dayHTML}</ul>
                    </div>
                `;
                container.appendChild(section);
            }
        }

        function toggleMonth(month) {
            const content = document.getElementById(`content-${month}`);
            const icon = document.getElementById(`icon-${month}`);
            content.classList.toggle('hidden-content');
            content.classList.toggle('visible-content');
            icon.classList.toggle('rotate-180');
        }

        window.onload = renderCalendar;
