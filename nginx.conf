server {
    listen 80;
    server_name localhost;

    # Standard location for your landing page
    location / {
        root /usr/share/nginx/html;
        index index.html;
    }

    # CRITICAL: Prevent caching for PDF and GED files 
    # and add CORS headers so the Topola viewer can read the GED file.
    location ~* \.(pdf|ged)$ {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        add_header 'Access-Control-Allow-Origin' '*';
        expires off;
    }
}
